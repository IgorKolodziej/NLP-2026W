random_seed: 42

paths:
  data_raw: data/raw
  data_processed: data/processed
  splits: splits
  cache: cache
  results: results/standalone

webis17:
  # from clickbait17-train-170630.zip → clickbait17-validation-170630/*.jsonl
  instances: data/raw/instances.jsonl
  truth: data/raw/truth.jsonl

splits:
  random_seeds: [42, 43, 44]
  random_ratios:
    train: 0.7
    val: 0.15
    test: 0.15

embedding_model: sentence-transformers/all-MiniLM-L6-v2
embeddings:
  revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
  batch_size: 32
  max_seq_length: 256
  normalize_embeddings: true

logistic_regression:
  class_weight: balanced
  max_iter: 1000
  solver: lbfgs

grid_search:
  scoring: macro_f1
  C: [0.01, 0.1, 1.0, 10.0, 100.0]
  tie_break: smallest_C

protocol:
  status: pilot
  min_test_size: 1000

training:
  # select C on validation; final LR fit on train only; test metrics never used for tuning
  refit_on: train
